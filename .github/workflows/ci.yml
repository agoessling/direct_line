name: Build and check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Formatting, lint, host tests, and embedded build
        run: tools/quality/check
      - name: Build hardware runner and check pinned debugger
        run: |
          bazel build //tools/debug:hil
          bazel run //tools/debug:probe_rs -- --version
      - name: Refresh editor metadata
        run: bazel run //tools/metadata:refresh
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
